services:
  fitsheet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitsheet
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC} # defaults to UTC; set TZ in a .env or your env for local time (e.g. TZ=America/Chicago)
      DATA_DIR: /app/data
      PORT: "3000"
      # Optional: enables AI nutrition-label reading. Put it in a .env next to this file
      # (ANTHROPIC_API_KEY=sk-...) or export it before `docker compose up`.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    ports:
      # Loopback only. There is no auth middleware on this API and it serves weight,
      # calorie, medication and cycle data -- publishing on 0.0.0.0 exposed all of it
      # to anything on the LAN or guest wifi. Reach it through the reverse proxy.
      - "127.0.0.1:3000:3000"
    volumes:
      # DB + uploaded photos. This single folder is the whole backup.
      - ./server/data:/app/data
